<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      /* Background Image Setup */
      background-image: url('./picss/images.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    /* Responsive Form Container */
    .form-container {
      margin: auto;
      width: 100%;
      max-width: 400px;
      height: auto;
      min-height: 500px;
      background-color: #fff;
      box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
      border-radius: 10px;
      padding: 30px 25px;
    }

    .title {
      text-align: center;
      font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
      margin: 10px 0 30px 0;
      font-size: 28px;
      font-weight: 800;
    }

    .form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 15px;
    }

    .input {
      border-radius: 20px;
      border: 1px solid #c0c0c0;
      outline: 0 !important;
      padding: 12px 15px;
      width: 100%;
      font-size: 14px;
    }

    /* Password Wrapper & Toggle Eye Icon */
    .password-wrapper {
      position: relative;
      width: 100%;
    }

    .password-wrapper .input {
      padding-right: 42px;
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      user-select: none;
      font-size: 16px;
      opacity: 0.7;
      transition: opacity 0.2s ease;
    }

    .toggle-password:hover {
      opacity: 1;
    }

    .page-link {
      text-decoration: underline;
      margin: 0;
      text-align: end;
      color: #747474;
      text-decoration-color: #747474;
    }

    .page-link-label {
      cursor: pointer;
      font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
      font-size: 11px;
      font-weight: 700;
    }

    .page-link-label:hover {
      color: #000;
    }

    .form-btn {
      padding: 12px 15px;
      font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
      border-radius: 20px;
      border: 0 !important;
      outline: 0 !important;
      background: teal;
      color: white;
      cursor: pointer;
      box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .form-btn:hover {
      background: #006666;
    }

    .form-btn:active {
      box-shadow: none;
    }

    .sign-up-label {
      margin: 0;
      font-size: 12px;
      color: #747474;
      font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
      text-align: center;
    }

    .sign-up-link a {
      margin-left: 4px;
      font-size: 12px;
      text-decoration: underline;
      text-decoration-color: teal;
      color: teal;
      cursor: pointer;
      font-weight: 800;
    }

    .buttons-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      margin-top: 20px;
      gap: 12px;
    }

    .apple-login-button,
    .google-login-button {
      border-radius: 20px;
      padding: 10px 15px;
      box-shadow: rgba(0, 0, 0, 0.16) 0px 10px 36px 0px,
        rgba(0, 0, 0, 0.06) 0px 0px 0px 1px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
        "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
      font-size: 12px;
      gap: 8px;
      transition: opacity 0.2s ease;
    }

    .apple-login-button:hover,
    .google-login-button:hover {
      opacity: 0.85;
    }

    .apple-login-button {
      background-color: #000;
      color: #fff;
      border: 2px solid #000;
    }

    .google-login-button {
      background-color: #fff;
      border: 2px solid #747474;
      color: #333;
    }

    .apple-icon,
    .google-icon {
      font-size: 18px;
    }

    /* Mobile responsiveness */
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .form-container {
        padding: 20px 18px;
      }
    }
  </style>
</head>

<body>

  <div class="form-container">
    <p class="title">Welcome back</p>
    <form class="form" id="login-form">
      <input type="email" id="email" class="input" placeholder="Email" required>

      <!-- Wrapped password input to position the toggle icon inside -->
      <div class="password-wrapper">
        <input type="password" id="password" class="input" placeholder="Password" required>
        <span class="toggle-password" id="toggleLoginPassword">👁️</span>
      </div>

      <p class="page-link">
        <span class="page-link-label">Forgot Password?</span>
      </p>
      <button type="submit" class="form-btn">Log in</button>
    </form>

    <p class="sign-up-label">
      Don't have an account?<span class="sign-up-link"><a href="signin.html">Sign up</a></span>
    </p>

    <div class="buttons-container">
      <div class="apple-login-button" id="apple-login-btn">
        <svg stroke="currentColor" fill="currentColor" stroke-width="0" class="apple-icon" viewBox="0 0 1024 1024"
          height="1em" width="1em" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M747.4 535.7c-.4-68.2 30.5-119.6 92.9-157.5-34.9-50-87.7-77.5-157.3-82.8-65.9-5.2-138 38.4-164.4 38.4-27.9 0-91.7-36.6-141.9-36.6C273.1 298.8 163 379.8 163 544.6c0 48.7 8.9 99 26.7 150.8 23.8 68.2 109.6 235.3 199.1 232.6 46.8-1.1 79.9-33.2 140.8-33.2 59.1 0 89.7 33.2 141.9 33.2 90.3-1.3 167.9-153.2 190.5-221.6-121.1-57.1-114.6-167.2-114.6-170.7zm-105.1-305c50.7-60.2 46.1-115 44.6-134.7-44.8 2.6-96.6 30.5-126.1 64.8-32.5 36.8-51.6 82.3-47.5 133.6 48.4 3.7 92.6-21.2 129-63.7z">
          </path>
        </svg>
        <span>Log in with Apple</span>
      </div>

      <div class="google-login-button" id="google-login-btn">
        <svg stroke="currentColor" fill="currentColor" stroke-width="0" version="1.1" x="0px" y="0px"
          class="google-icon" viewBox="0 0 48 48" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg">
          <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12
  c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24
  c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
          <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657
  C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path>
          <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36
  c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path>
          <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571
  c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z">
          </path>
        </svg>
        <span>Log in with Google</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import {
      getAuth,
      signInWithPopup,
      GoogleAuthProvider,
      OAuthProvider,
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcB6y16zcRnYUsi3Yg4mVWoVUQSk6EkXM",
      authDomain: "e-commance-3d365.firebaseapp.com",
      projectId: "e-commance-3d365",
      storageBucket: "e-commance-3d365.firebasestorage.app",
      messagingSenderId: "91723916780",
      appId: "1:91723916780:web:a5e7079edb49ed84118cc9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Auth Providers
    const googleProvider = new GoogleAuthProvider();
    const appleProvider = new OAuthProvider('apple.com');
    appleProvider.addScope('email');
    appleProvider.addScope('name');

    // Password Visibility Toggle Logic
    const togglePassword = document.getElementById('toggleLoginPassword');
    const passwordInput = document.getElementById('password');

    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
    });

    // Forgot Password Listener
    const forgotPasswordBtn = document.querySelector('.page-link-label');
    forgotPasswordBtn.addEventListener('click', () => {
      const email = document.getElementById('email').value.trim();

      if (!email) {
        alert("Please enter your email address in the input field first.");
        return;
      }

      sendPasswordResetEmail(auth, email)
        .then(() => {
          alert("Password reset email sent! Please check your inbox/spam folder.");
        })
        .catch((error) => {
          console.error("Password Reset Error:", error.message);
          alert("Reset failed: " + error.message);
        });
    });

    // Apple Login Listener
    const appleBtn = document.getElementById('apple-login-btn');
    appleBtn.addEventListener('click', () => {
      signInWithPopup(auth, appleProvider)
        .then((result) => {
          console.log("Logged in Apple user:", result.user);
          window.location.href = "home.html";
        })
        .catch((error) => {
          console.error("Apple Auth Error:", error.message);
          alert("Apple Sign-In failed: " + error.message);
        });
    });

    // Google Login Listener
    const googleBtn = document.getElementById('google-login-btn');
    googleBtn.addEventListener('click', () => {
      signInWithPopup(auth, googleProvider)
        .then((result) => {
          console.log("Logged in user:", result.user);
          window.location.href = "home.html";
        })
        .catch((error) => {
          console.error("Google Auth Error:", error.message);
          alert("Google Sign-In failed: " + error.message);
        });
    });

    // Email/Password Login Listener
    const form = document.getElementById('login-form');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = passwordInput.value;

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          console.log("Signed in:", userCredential.user);
          window.location.href = "home.html";
        })
        .catch((error) => {
          console.error("Email Auth Error:", error.message);
          alert("Login failed: " + error.message);
        });
    });
  </script>
</body>

</html>
