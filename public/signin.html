<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get started on WhatsApp Storefront</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1a1a1a;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #444444;
            margin-bottom: 6px;
            margin-top: 16px;
            letter-spacing: 0.5px;
        }

        .input-group {
            display: flex;
            gap: 12px;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
            color: #333333;
            background-color: #f9f9f9;
            transition: all 0.2s ease;
        }

        /* Password Field Wrapper for Eye Icon */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 40px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            user-select: none;
            font-size: 16px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #fbc02d;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(251, 192, 45, 0.2);
        }

        .info-text {
            font-size: 12px;
            color: #777777;
            margin-top: 6px;
            line-height: 1.4;
        }

        .terms-text {
            font-size: 12px;
            color: #555555;
            line-height: 1.5;
            margin-top: 20px;
        }

        .message-box {
            display: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 16px;
            text-align: center;
        }

        .message-box.error {
            display: block;
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        .message-box.success {
            display: block;
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        a {
            color: #d81b60;
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 24px;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #333333;
        }

        .login-footer {
            text-align: center;
            font-size: 14px;
            color: #666666;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }

        @media (max-width: 480px) {
            .input-group {
                flex-direction: column;
                gap: 0;
            }

            .form-container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h1>Get started on WhatsApp Storefront</h1>
        <p class="subtitle">Create an account to connect with friends, family and communities of people who share your interests.</p>

        <div id="messageBox" class="message-box"></div>

        <form id="signupForm">
            <label>NAME</label>
            <div class="input-group">
                <input type="text" id="firstName" placeholder="First name" required>
                <input type="text" id="surname" placeholder="Surname" required>
            </div>

            <label for="dob">DATE OF BIRTH</label>
            <input type="date" id="dob" required>

            <label for="gender">GENDER</label>
            <select id="gender" required>
                <option value="" disabled selected>Select gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="custom">Custom</option>
            </select>

            <label>CONTACT INFORMATION</label>
            <div class="input-group">
                <input type="number" placeholder="Mobile number" required>
                <input type="email" id="email" placeholder="Email" required>
            </div>
            <p class="info-text">You may receive SMS notifications from us.</p>

            <label for="password">PASSWORD</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="New password" required>
                <span class="toggle-password" id="togglePassword">👁️</span>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">Sign Up</button>

            <div class="login-footer">
                <span>Already have an account?</span> <a href="index.html">Log In</a>
            </div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcB6y16zcRnYUsi3Yg4mVWoVUQSk6EkXM",
            authDomain: "e-commance-3d365.firebaseapp.com",
            projectId: "e-commance-3d365",
            storageBucket: "e-commance-3d365.firebasestorage.app",
            messagingSenderId: "91723916780",
            appId: "1:91723916780:web:a5e7079edb49ed84118cc9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Password Visibility Toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Sign-Up Logic
        const form = document.getElementById('signupForm');
        const messageBox = document.getElementById('messageBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const firstName = document.getElementById('firstName').value;
            const surname = document.getElementById('surname').value;
            const fullName = `${firstName} ${surname}`;
            const email = document.getElementById('email').value;
            const password = passwordInput.value;

            messageBox.className = 'message-box';
            messageBox.innerText = '';

            try {
                // 1. Create User
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                
                // 2. Save User Name to Firebase
                await updateProfile(userCredential.user, {
                    displayName: fullName
                });

                messageBox.className = 'message-box success';
                messageBox.innerText = 'Account created successfully! Redirecting to login...';

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);

            } catch (error) {
                messageBox.className = 'message-box error';
                messageBox.innerText = 'Signup failed: ' + error.message;
            }
        });
    </script>
</body>

</html>
